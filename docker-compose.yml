services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_exam
      POSTGRES_USER: smart_exam
      POSTGRES_PASSWORD: local_change_this_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_exam -d smart_exam"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://smart_exam:local_change_this_password@postgres:5432/smart_exam
      REDIS_URL: redis://redis:6379/0
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
